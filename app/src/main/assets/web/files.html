<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="theme-color" content="#000000">
    <title>Files - Android HTTP Server</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📁</text></svg>">
    <link href="style.css" rel="stylesheet">
</head>
<body class="page-files">

<!-- ── Top bar ─────────────────────────────────────────── -->
<header class="topbar">
    <h1 class="topbar-title">File Server</h1>
    <div class="topbar-actions">
        <button id="activityToggle" class="btn btn-ghost btn-sm" title="Activity log">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            <span class="hide-xs">Activity</span>
            <span id="activityCount" class="act-count" style="display:none">0</span>
        </button>
        <span id="userBadge" class="badge"></span>
        <button id="logoutBtn" class="btn btn-ghost btn-sm">Logout</button>
    </div>
</header>

<!-- ── Toolbar ─────────────────────────────────────────── -->
<nav class="toolbar">
    <button id="parentBtn" class="btn btn-icon" title="Parent" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div id="breadcrumbs" class="crumbs"></div>
    <div class="toolbar-right">
        <label class="toggle"><input type="checkbox" id="showHidden"><span>Hidden</span></label>
        <button id="newFolderBtn" class="btn btn-ghost btn-sm" title="New folder">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
            <span class="hide-xs">Folder</span>
        </button>
        <button id="newFileBtn" class="btn btn-ghost btn-sm" title="New file">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
            <span class="hide-xs">File</span>
        </button>
        <button id="uploadBtn" class="btn btn-accent btn-sm" title="Upload files">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
            <span class="hide-xs">Upload</span>
        </button>
        <input type="file" id="fileInput" multiple style="display:none">
    </div>
</nav>

<!-- ── Upload progress bar ─────────────────────────────── -->
<div id="uploadBar" class="upload-bar" style="display:none">
    <div class="upload-bar-inner">
        <span id="uploadStatus">Uploading...</span>
        <div class="upload-progress"><div id="uploadProgress" class="upload-progress-fill"></div></div>
    </div>
</div>

<!-- ── Drop zone overlay ───────────────────────────────── -->
<div id="dropZone" class="drop-zone">
    <div class="drop-zone-inner">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
        <p>Drop files to upload</p>
    </div>
</div>

<!-- ── States ──────────────────────────────────────────── -->
<div id="loading" class="state"><div class="spinner"></div><span>Loading...</span></div>
<div id="errorState" class="state state-error" style="display:none"><p id="errorMsg"></p><button onclick="loadFiles(currentPath)" class="btn btn-accent btn-sm">Retry</button></div>
<div id="emptyState" class="state" style="display:none">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    <p>Empty folder</p>
</div>

<!-- ── File table ──────────────────────────────────────── -->
<div id="tableWrap" class="table-wrap" style="display:none">
<table class="ftable">
    <thead><tr>
        <th class="c-name">Name</th>
        <th class="c-size">Size</th>
        <th class="c-date">Modified</th>
        <th class="c-act"></th>
    </tr></thead>
    <tbody id="fileList"></tbody>
</table>
</div>

<!-- ── Activity panel (slide-in) ───────────────────────── -->
<div id="activityPanel" class="activity-panel">
    <div class="activity-header">
        <h3>Activity Log</h3>
        <button onclick="toggleActivity()" class="btn btn-icon">&times;</button>
    </div>
    <div id="activityList" class="activity-list">
        <p class="activity-empty">No activity yet</p>
    </div>
</div>

<!-- ── Editor modal ────────────────────────────────────── -->
<div id="editorModal" class="modal" style="display:none">
    <div class="modal-content editor-modal">
        <div class="modal-header">
            <h2 id="editorTitle">Edit File</h2>
            <button onclick="closeEditor()" class="btn btn-icon">&times;</button>
        </div>
        <textarea id="editorArea" class="editor-textarea" spellcheck="false"></textarea>
        <div class="modal-footer">
            <button onclick="closeEditor()" class="btn btn-ghost btn-sm">Cancel</button>
            <button onclick="saveFile()" id="saveBtn" class="btn btn-accent btn-sm">Save</button>
        </div>
    </div>
</div>

<!-- ── Create modal ────────────────────────────────────── -->
<div id="createModal" class="modal" style="display:none">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="createTitle">New File</h2>
            <button onclick="closeCreate()" class="btn btn-icon">&times;</button>
        </div>
        <div class="field">
            <label for="createName">Name</label>
            <input type="text" id="createName" placeholder="filename.txt">
        </div>
        <div class="modal-footer">
            <button onclick="closeCreate()" class="btn btn-ghost btn-sm">Cancel</button>
            <button onclick="doCreate()" id="createBtn" class="btn btn-accent btn-sm">Create</button>
        </div>
    </div>
</div>

<!-- ── Toast ───────────────────────────────────────────── -->
<div id="toast" class="toast"></div>

<script>
let currentPath = '';
let parentPath = null;
let editingPath = '';
let createIsDir = false;
const activityLog = [];

// ── Auth ──────────────────────────────────────────────
fetch('/api/session').then(r => {
    if (!r.ok) { window.location.href = '/login.html'; return null; }
    return r.json();
}).then(d => {
    if (d?.data) {
        document.getElementById('userBadge').textContent = d.data.username;
        logActivity('info', 'Logged in as ' + d.data.username);
        loadFiles();
    }
});

document.getElementById('logoutBtn').onclick = async () => {
    await fetch('/api/logout', {method:'POST'});
    window.location.href = '/login.html';
};

// ── Navigation ────────────────────────────────────────
document.getElementById('parentBtn').onclick = () => { if (parentPath) loadFiles(parentPath); };
document.getElementById('showHidden').onchange = () => loadFiles(currentPath);

// ── Upload ────────────────────────────────────────────
document.getElementById('uploadBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => { uploadFiles(e.target.files); e.target.value=''; };

let dragCount = 0;
const dz = document.getElementById('dropZone');
document.addEventListener('dragenter', (e) => { e.preventDefault(); dragCount++; dz.classList.add('active'); });
document.addEventListener('dragleave', (e) => { e.preventDefault(); dragCount--; if(dragCount<=0){dragCount=0;dz.classList.remove('active');} });
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => { e.preventDefault(); dragCount=0; dz.classList.remove('active'); if(e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files); });

async function uploadFiles(fileList) {
    const files = Array.from(fileList);
    if (!files.length) return;

    const bar = document.getElementById('uploadBar');
    const status = document.getElementById('uploadStatus');
    const progress = document.getElementById('uploadProgress');
    bar.style.display = 'block';
    progress.style.width = '0%';

    let uploaded = 0;
    let failed = 0;

    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        status.textContent = 'Uploading ' + (i+1) + '/' + files.length + ': ' + file.name;
        progress.style.width = ((i / files.length) * 100) + '%';

        const form = new FormData();
        form.append('file', file, file.name);

        try {
            const res = await fetch('/api/files/upload?path=' + encodeURIComponent(currentPath), {
                method: 'POST', body: form
            });
            if (res.status === 401) { window.location.href = '/login.html'; return; }
            const data = await res.json();
            if (res.ok) {
                uploaded++;
                logActivity('success', 'Uploaded: ' + file.name + ' (' + fmtSize(file.size) + ')');
            } else {
                failed++;
                logActivity('error', 'Failed: ' + file.name + ' \u2014 ' + (data.error||'Unknown error'));
            }
        } catch(_) {
            failed++;
            logActivity('error', 'Failed: ' + file.name + ' \u2014 Network error');
        }
    }

    progress.style.width = '100%';
    const msg = uploaded + ' uploaded' + (failed ? ', ' + failed + ' failed' : '');
    status.textContent = msg;
    toast(msg, failed ? 'error' : 'success');

    setTimeout(() => { bar.style.display = 'none'; }, 2000);
    loadFiles(currentPath);
}

// ── Create ────────────────────────────────────────────
document.getElementById('newFileBtn').onclick = () => { createIsDir=false; document.getElementById('createTitle').textContent='New File'; document.getElementById('createName').placeholder='filename.txt'; document.getElementById('createModal').style.display='flex'; document.getElementById('createName').focus(); };
document.getElementById('newFolderBtn').onclick = () => { createIsDir=true; document.getElementById('createTitle').textContent='New Folder'; document.getElementById('createName').placeholder='folder-name'; document.getElementById('createModal').style.display='flex'; document.getElementById('createName').focus(); };
function closeCreate() { document.getElementById('createModal').style.display='none'; document.getElementById('createName').value=''; }

async function doCreate() {
    const name = document.getElementById('createName').value.trim();
    if (!name) return;
    const fullPath = currentPath + '/' + name;
    const type = createIsDir ? 'folder' : 'file';
    try {
        const res = await fetch('/api/files/create', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ path: fullPath, isDirectory: createIsDir })
        });
        if (res.status===401) { window.location.href='/login.html'; return; }
        const data = await res.json();
        if (res.ok) {
            toast('Created ' + type + ': ' + name, 'success');
            logActivity('success', 'Created ' + type + ': ' + name);
            closeCreate(); loadFiles(currentPath);
        } else {
            toast(data.error||'Failed', 'error');
            logActivity('error', 'Create failed: ' + name + ' \u2014 ' + (data.error||''));
        }
    } catch(_) { toast('Failed to create', 'error'); logActivity('error', 'Create failed: ' + name); }
}

// ── Editor ────────────────────────────────────────────
async function openEditor(path, name) {
    editingPath = path;
    document.getElementById('editorTitle').textContent = name;
    document.getElementById('editorArea').value = 'Loading...';
    document.getElementById('editorModal').style.display = 'flex';
    logActivity('info', 'Editing: ' + name);
    try {
        const res = await fetch('/api/files/content?path=' + encodeURIComponent(path));
        if (res.status===401) { window.location.href='/login.html'; return; }
        if (!res.ok) { const d=await res.json(); toast(d.error||'Cannot open','error'); closeEditor(); return; }
        document.getElementById('editorArea').value = await res.text();
    } catch(_) { toast('Failed to load file','error'); closeEditor(); }
}
function closeEditor() { document.getElementById('editorModal').style.display='none'; editingPath=''; }

async function saveFile() {
    const btn = document.getElementById('saveBtn');
    const name = editingPath.split('/').pop();
    btn.disabled=true; btn.textContent='Saving...';
    try {
        const res = await fetch('/api/files/content?path=' + encodeURIComponent(editingPath), {
            method:'PUT', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ content: document.getElementById('editorArea').value })
        });
        if (res.status===401) { window.location.href='/login.html'; return; }
        const data = await res.json();
        if (res.ok) {
            toast('Saved: ' + name, 'success');
            logActivity('success', 'Saved: ' + name);
            closeEditor(); loadFiles(currentPath);
        } else {
            toast(data.error||'Save failed','error');
            logActivity('error', 'Save failed: ' + name + ' \u2014 ' + (data.error||''));
        }
    } catch(_) { toast('Save failed','error'); }
    finally { btn.disabled=false; btn.textContent='Save'; }
}

// ── Delete ────────────────────────────────────────────
async function deleteItem(path, name) {
    if (!confirm('Delete "' + name + '"?')) return;
    try {
        const res = await fetch('/api/files?path=' + encodeURIComponent(path), { method:'DELETE' });
        if (res.status===401) { window.location.href='/login.html'; return; }
        const data = await res.json();
        if (res.ok) {
            toast('Deleted: ' + name, 'success');
            logActivity('success', 'Deleted: ' + name);
            loadFiles(currentPath);
        } else {
            toast(data.error||'Delete failed','error');
            logActivity('error', 'Delete failed: ' + name + ' \u2014 ' + (data.error||''));
        }
    } catch(_) { toast('Delete failed','error'); logActivity('error', 'Delete failed: ' + name); }
}

// ── File list ─────────────────────────────────────────
async function loadFiles(path) {
    show('loading'); hide('tableWrap','errorState','emptyState');
    const showHidden = document.getElementById('showHidden').checked;
    let url = '/api/files';
    const p = new URLSearchParams();
    if (path) p.set('path', path);
    if (showHidden) p.set('showHidden','true');
    if (p.toString()) url += '?' + p;

    try {
        const res = await fetch(url);
        if (res.status===401) { window.location.href='/login.html'; return; }
        if (!res.ok) { const e=await res.json(); throw new Error(e.error||'Failed'); }
        const data = await res.json();
        const fd = data.data;
        currentPath = fd.path; parentPath = fd.parent;
        document.getElementById('parentBtn').disabled = !parentPath;
        renderCrumbs(currentPath);
        renderFiles(fd.items);
        hide('loading');
        if (fd.items.length===0) show('emptyState'); else show('tableWrap');
    } catch(e) { hide('loading'); document.getElementById('errorMsg').textContent=e.message; show('errorState'); }
}

function renderCrumbs(path) {
    const el = document.getElementById('breadcrumbs');
    const parts = path.split('/').filter(Boolean);
    let html='', acc='';
    for (let i=0;i<parts.length;i++) {
        acc += '/' + parts[i];
        if (i===parts.length-1) html += '<span class="crumb-cur">' + esc(parts[i]) + '</span>';
        else html += '<a class="crumb-link" onclick="loadFiles(\'' + acc.replace(/'/g,"\\'") + '\')">' + esc(parts[i]) + '</a><span class="crumb-sep">/</span>';
    }
    el.innerHTML = html;
}

function renderFiles(items) {
    const tb = document.getElementById('fileList');
    tb.innerHTML = '';
    for (const it of items) {
        const tr = document.createElement('tr');
        tr.className = it.isDirectory ? 'row-dir' : 'row-file';

        const td1 = document.createElement('td');
        td1.className = 'c-name';
        td1.innerHTML = (it.isDirectory ? iconFolder() : iconFile(it.name)) + '<span class="fname">' + esc(it.name) + '</span>';
        if (it.isDirectory) { td1.style.cursor='pointer'; td1.onclick = () => loadFiles(it.path); }
        else if (isEditable(it.name)) { td1.style.cursor='pointer'; td1.onclick = () => openEditor(it.path, it.name); }

        const td2 = document.createElement('td');
        td2.className = 'c-size';
        td2.textContent = it.isDirectory ? '\u2014' : fmtSize(it.size);

        const td3 = document.createElement('td');
        td3.className = 'c-date';
        td3.textContent = it.lastModified > 0 ? fmtDate(it.lastModified) : '\u2014';

        const td4 = document.createElement('td');
        td4.className = 'c-act';
        if (!it.isDirectory) {
            const dl = document.createElement('a');
            dl.href = '/api/files/download?path=' + encodeURIComponent(it.path);
            dl.className = 'act-btn'; dl.title = 'Download';
            dl.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
            dl.onclick = (e) => { e.stopPropagation(); logActivity('info', 'Download: ' + it.name); };
            td4.appendChild(dl);
        }
        const del = document.createElement('button');
        del.className = 'act-btn act-del'; del.title = 'Delete';
        del.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
        del.onclick = (e) => { e.stopPropagation(); deleteItem(it.path, it.name); };
        td4.appendChild(del);

        tr.append(td1, td2, td3, td4);
        tb.appendChild(tr);
    }
}

// ── Activity log ──────────────────────────────────────
function logActivity(type, msg) {
    const now = new Date();
    const time = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
    activityLog.unshift({ type, msg, time });
    if (activityLog.length > 50) activityLog.pop();
    updateActivityCount();
    renderActivity();
}

function updateActivityCount() {
    const el = document.getElementById('activityCount');
    el.textContent = activityLog.length;
    el.style.display = activityLog.length > 0 ? 'inline-flex' : 'none';
}

function renderActivity() {
    const el = document.getElementById('activityList');
    if (!activityLog.length) { el.innerHTML='<p class="activity-empty">No activity yet</p>'; return; }
    el.innerHTML = activityLog.map(a => {
        const icon = a.type==='success' ? '\u2705' : a.type==='error' ? '\u274c' : '\u2139\ufe0f';
        return '<div class="activity-item activity-'+a.type+'"><span class="activity-time">'+a.time+'</span><span class="activity-icon">'+icon+'</span><span class="activity-msg">'+esc(a.msg)+'</span></div>';
    }).join('');
}

document.getElementById('activityToggle').onclick = toggleActivity;
function toggleActivity() {
    document.getElementById('activityPanel').classList.toggle('open');
}

// ── Helpers ───────────────────────────────────────────
const EDIT_EXTS = ['txt','md','json','xml','yaml','yml','html','css','js','ts','py','java','kt','kts','c','cpp','h','rs','go','sh','bash','zsh','toml','ini','cfg','conf','log','csv','properties','gradle','pro','gitignore','env','dockerfile','makefile','sql','rb','php','swift','dart','lua','r','pl','pm','tex','bib','rst','org'];
function isEditable(name) { const n=name.toLowerCase(); const ext=n.split('.').pop(); return EDIT_EXTS.includes(ext) || n.startsWith('.'); }

function iconFolder() { return '<svg class="ficon ic-folder" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg>'; }
function iconFile(name) {
    const ext=name.split('.').pop().toLowerCase();
    const colors={jpg:'#a78bfa',jpeg:'#a78bfa',png:'#a78bfa',gif:'#a78bfa',webp:'#a78bfa',svg:'#a78bfa',mp4:'#c084fc',mkv:'#c084fc',mov:'#c084fc',mp3:'#c084fc',wav:'#c084fc',pdf:'#f87171',doc:'#60a5fa',docx:'#60a5fa',xls:'#34d399',xlsx:'#34d399',zip:'#fbbf24',tar:'#fbbf24',gz:'#fbbf24',rar:'#fbbf24','7z':'#fbbf24',apk:'#34d399',js:'#fbbf24',ts:'#60a5fa',py:'#34d399',java:'#f87171',kt:'#a78bfa',rs:'#f97316',go:'#60a5fa',html:'#f87171',css:'#60a5fa',json:'#fbbf24',xml:'#f97316',sh:'#34d399'};
    const c=colors[ext]||'#525252';
    return '<svg class="ficon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
}

function fmtSize(b) { if(!b) return '0 B'; const u=['B','KB','MB','GB','TB']; const i=Math.floor(Math.log(b)/Math.log(1024)); return parseFloat((b/Math.pow(1024,i)).toFixed(1))+' '+u[i]; }
function fmtDate(ts) {
    const d=new Date(ts), n=new Date(), pad=n=>String(n).padStart(2,'0');
    const time = pad(d.getHours())+':'+pad(d.getMinutes());
    if (d.toDateString()===n.toDateString()) return 'Today '+time;
    const y=new Date(n); y.setDate(y.getDate()-1);
    if (d.toDateString()===y.toDateString()) return 'Yesterday '+time;
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+time;
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function show(id){document.getElementById(id).style.display='flex';}
function hide(...ids){ids.forEach(id=>document.getElementById(id).style.display='none');}

function toast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type==='error'?' toast-error':type==='success'?' toast-success':'');
    clearTimeout(t._tid);
    t._tid = setTimeout(() => t.className='toast', 3000);
}

document.getElementById('createName').addEventListener('keydown', (e) => { if(e.key==='Enter'){e.preventDefault();doCreate();} });
</script>
</body>
</html>
