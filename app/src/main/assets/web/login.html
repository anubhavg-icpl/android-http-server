<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="theme-color" content="#000000">
    <title>Login - Android HTTP Server</title>
    <link href="style.css" rel="stylesheet">
</head>
<body class="page-login">
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <h1>File Server</h1>
            <p class="login-sub">Sign in to continue</p>
        </div>

        <form id="loginForm" autocomplete="on">
            <div id="errorBox" class="error-box" style="display:none"></div>

            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username"
                       placeholder="admin" required autofocus>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password"
                       placeholder="Password" required>
            </div>

            <button type="submit" id="loginBtn" class="btn btn-accent">Sign In</button>
        </form>

        <p class="login-footer">Android HTTP Server &middot; <a href="https://github.com/mranv" target="_blank">mranv</a></p>
    </div>
</div>

<script>
    fetch('/api/session').then(r => { if (r.ok) window.location.href = '/files.html'; });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = document.getElementById('errorBox');
        const btn = document.getElementById('loginBtn');
        err.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Signing in\u2026';

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await res.json();
            if (res.ok) { window.location.href = '/files.html'; return; }
            err.textContent = data.error || 'Invalid credentials';
            err.style.display = 'block';
        } catch (_) {
            err.textContent = 'Connection failed';
            err.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
    });
</script>
</body>
</html>
